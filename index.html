<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>HaySolcito - Ventanas de Sol</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @keyframes pulse-sun {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.08); opacity: 0.85; }
    }
    .sun-pulse { animation: pulse-sun 3s infinite ease-in-out; }
    body {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      transition: background 1.2s ease-in-out;
    }
    .accent-bg { background-color: #ff740e; }
    .accent-text { color: #ff740e; }
    .accent-gradient { background: linear-gradient(to right, #ff740e, #ff8c38); }
    /* Ocultar barra de desplazamiento manteniendo scroll fluido */
    .scrollbar-none::-webkit-scrollbar { display: none; }
    .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body id="app-body" class="bg-gradient-to-b from-sky-400 to-sky-600 text-slate-100 min-h-screen font-sans flex flex-col justify-between">

  <!-- Zona Superior / Contenido Principal -->
  <div class="max-w-md w-full mx-auto p-4 flex-1 pb-44">
    <!-- Header -->
    <header class="flex items-center justify-between py-3 px-4 border-b border-white/20 mb-5 backdrop-blur-md rounded-2xl bg-black/10 shadow-sm">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-full bg-[#ff740e]/20 flex items-center justify-center text-[#ff740e] text-lg">
          <i class="fa-solid fa-sun sun-pulse"></i>
        </div>
        <div>
          <h1 class="font-bold text-base leading-tight accent-text tracking-tight">HaySolcito</h1>
          <p class="text-[11px] text-sky-100/80">Ventanas de sol precisas</p>
        </div>
      </div>
      <button id="btn-sound-test" class="text-xs bg-white/20 hover:bg-white/30 text-white px-3 py-1.5 rounded-xl transition flex items-center gap-1.5 backdrop-blur-md font-medium">
        <i class="fa-solid fa-volume-high accent-text"></i> Alarma
      </button>
    </header>

    <!-- Estado Actual y Próxima Ventana -->
    <section class="bg-black/25 backdrop-blur-2xl rounded-3xl p-5 mb-5 border border-white/15 shadow-2xl relative overflow-hidden">
      <div class="space-y-4">
        <div class="flex items-center justify-between">
          <span class="text-xs font-semibold tracking-wider text-sky-200/80 uppercase">Estado en este momento</span>
          <span id="current-cloud-badge" class="px-3 py-1 rounded-full text-xs font-bold bg-white/20 text-white backdrop-blur-md">--% nubes</span>
        </div>
        <div class="flex items-center gap-4">
          <div id="current-icon" class="text-4xl text-white">
            <i class="fa-solid fa-spinner fa-spin"></i>
          </div>
          <div>
            <h2 id="current-status-title" class="text-lg font-bold text-white leading-snug">Consultando cielo...</h2>
            <p id="current-status-desc" class="text-xs text-sky-100/80">Analizando satélite meteorológico.</p>
          </div>
        </div>

        <div class="pt-4 border-t border-white/15">
          <span class="text-xs font-semibold tracking-wider accent-text uppercase block mb-1">Próxima ventana de sol</span>
          <div class="flex items-baseline justify-between">
            <div id="next-window-time" class="text-2xl font-black text-white">--:--</div>
            <div id="next-window-countdown" class="text-xs font-semibold accent-text bg-[#ff740e]/20 border border-[#ff740e]/30 px-3 py-1.5 rounded-xl backdrop-blur-md">Calculando...</div>
          </div>
        </div>
      </div>
    </section>

    <!-- Pronóstico de Nubosidad del Día -->
    <section class="bg-black/20 backdrop-blur-xl rounded-3xl p-4 border border-white/10 shadow-xl">
      <h3 class="text-xs font-semibold text-sky-200/80 mb-3 uppercase tracking-wider">Nubosidad hora por hora</h3>
      <div id="hourly-forecast" class="flex gap-2 overflow-x-auto pb-2 text-center scrollbar-none">
        <div class="text-xs text-sky-200 py-4 w-full">Cargando datos locales...</div>
      </div>
    </section>
  </div>

  <!-- Dock Inferior Ergonómico (Thumb-Zone para una sola mano) -->
  <div class="fixed bottom-0 left-0 right-0 bg-slate-950/85 backdrop-blur-2xl border-t border-white/15 p-4 shadow-2xl z-50">
    <div class="max-w-md mx-auto space-y-3">
      
      <!-- Entrada manual de Ubicación Precisa (Barrio / Localidad) -->
      <div class="flex gap-2">
        <div class="relative flex-1">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
            <i class="fa-solid fa-location-dot accent-text text-xs"></i>
          </span>
          <input type="text" id="city-input" placeholder="Ej: Palermo, San Isidro, La Plata..." value="Palermo, Buenos Aires" class="w-full bg-black/50 border border-white/15 rounded-2xl pl-9 pr-3 py-2.5 text-xs text-white placeholder-slate-400 focus:outline-none focus:border-[#ff740e] transition">
        </div>
        <button id="btn-search" class="accent-bg hover:opacity-90 text-slate-950 font-semibold px-4 py-2.5 rounded-2xl text-xs transition shadow-md shrink-0">
          Buscar
        </button>
        <button id="btn-gps" class="bg-white/10 hover:bg-white/20 text-white w-10 h-10 rounded-2xl flex items-center justify-center transition text-xs shrink-0" title="Usar GPS exacto">
          <i class="fa-solid fa-location-crosshairs"></i>
        </button>
      </div>

      <!-- Selector de Anticipación y Estado -->
      <div class="flex items-center justify-between gap-2 bg-black/40 border border-white/10 rounded-2xl px-3 py-2">
        <span id="location-display" class="text-[11px] text-sky-200/90 font-medium truncate">Ubicación precisa</span>
        <div class="flex gap-1 shrink-0" id="seg">
          <!-- Generado por JS -->
        </div>
      </div>

      <!-- Botón de Activar Alarma -->
      <button id="notifBtn" class="w-full accent-gradient hover:opacity-90 text-slate-950 font-bold py-3 rounded-2xl text-xs shadow-lg transition flex items-center justify-center gap-2">
        <i class="fa-solid fa-bell"></i> Activar Notificaciones de Alarma
      </button>

    </div>
  </div>

  <!-- Toast flotante -->
  <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 -translate-y-40 bg-slate-900/90 text-white border border-white/20 backdrop-blur-2xl px-4 py-3 rounded-2xl shadow-2xl transition-all duration-400 max-w-[90%] text-xs z-50"></div>

  <script>
    const MINUTES = [15, 30, 45, 60];
    let minutes = 30;
    let currentLat = -34.5885; // Coordenada base (ej. Palermo)
    let currentLng = -58.4312;
    let forecastHours = [];
    const maxCloudThreshold = 30; // Consideramos "sol/ventana" con <= 30% de nubes

    const appBody = document.getElementById('app-body');
    const cityInput = document.getElementById('city-input');
    const locationDisplay = document.getElementById('location-display');
    const currentCloudBadge = document.getElementById('current-cloud-badge');
    const currentIcon = document.getElementById('current-icon');
    const currentStatusTitle = document.getElementById('current-status-title');
    const currentStatusDesc = document.getElementById('current-status-desc');
    const nextWindowTime = document.getElementById('next-window-time');
    const nextWindowCountdown = document.getElementById('next-window-countdown');
    const hourlyForecast = document.getElementById('hourly-forecast');

    function playAlertSound() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523.25, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.4);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.6);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.6);
    }

    document.getElementById('btn-sound-test').addEventListener('click', playAlertSound);

    // Sistema de Fondo Realista según Nubosidad Actual (10 niveles)
    function updateDynamicBackground(cloudCover) {
      if (cloudCover <= 10) {
        appBody.className = "bg-gradient-to-b from-sky-400 via-sky-500 to-blue-600 text-slate-100 min-h-screen font-sans flex flex-col justify-between";
      } else if (cloudCover <= 20) {
        appBody.className = "bg-gradient-to-b from-sky-400 via-sky-500 to-blue-700 text-slate-100 min-h-screen font-sans flex flex-col justify-between";
      } else if (cloudCover <= 30) {
        appBody.className = "bg-gradient-to-b from-sky-500 via-blue-600 to-indigo-700 text-slate-100 min-h-screen font-sans flex flex-col justify-between";
      } else if (cloudCover <= 40) {
        appBody.className = "bg-gradient-to-b from-sky-500 via-blue-700 to-slate-700 text-slate-100 min-h-screen font-sans flex flex-col justify-between";
      } else if (cloudCover <= 50) {
        appBody.className = "bg-gradient-to-b from-slate-400 via-slate-500 to-slate-700 text-slate-100 min-h-screen font-sans flex flex-col justify-between";
      } else if (cloudCover <= 60) {
        appBody.className = "bg-gradient-to-b from-slate-500 via-slate-600 to-slate-800 text-slate-100 min-h-screen font-sans flex flex-col justify-between";
      } else if (cloudCover <= 70) {
        appBody.className = "bg-gradient-to-b from-slate-600 via-slate-700 to-zinc-800 text-slate-100 min-h-screen font-sans flex flex-col justify-between";
      } else if (cloudCover <= 80) {
        appBody.className = "bg-gradient-to-b from-slate-700 via-zinc-700 to-zinc-900 text-slate-100 min-h-screen font-sans flex flex-col justify-between";
      } else if (cloudCover <= 90) {
        appBody.className = "bg-gradient-to-b from-zinc-700 via-zinc-800 to-slate-950 text-slate-100 min-h-screen font-sans flex flex-col justify-between";
      } else {
        appBody.className = "bg-gradient-to-b from-zinc-800 via-slate-900 to-stone-950 text-slate-100 min-h-screen font-sans flex flex-col justify-between";
      }
    }

    function renderSeg() {
      const box = document.getElementById('seg');
      box.innerHTML = '';
      MINUTES.forEach(m => {
        const b = document.createElement('button');
        b.textContent = m + 'm';
        b.className = `px-2 py-1 rounded-xl text-[11px] font-semibold transition ${m === minutes ? 'accent-bg text-slate-950 shadow-md' : 'bg-transparent text-sky-200'}`;
        b.onclick = () => { minutes = m; renderSeg(); evaluateSunWindows(); };
        box.appendChild(b);
      });
    }

    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.transform = 'translateX(-50%) translateY(0)';
      setTimeout(() => { t.style.transform = 'translateX(-50%) translateY(-160px)'; }, 4000);
    }

    // Geocodificación precisa por texto libre (Barrios, Localidades, Partidos)
    async function fetchLocationCoords(query) {
      try {
        locationDisplay.textContent = "Buscando zona...";
        const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=5&language=es`);
        const data = await res.json();
        if (data.results && data.results.length > 0) {
          // Priorizar resultados en Argentina
          const loc = data.results.find(r => r.country === "Argentina") || data.results[0];
          currentLat = loc.latitude;
          currentLng = loc.longitude;
          const detail = `${loc.name}${loc.admin1 ? ', ' + loc.admin1 : ''}`;
          locationDisplay.textContent = detail;
          fetchWeatherData();
        } else {
          locationDisplay.textContent = "Zona no encontrada";
          toast("⚠️ No se encontró esa ubicación exacta.");
        }
      } catch (err) {
        locationDisplay.textContent = "Error de conexión";
      }
    }

    // Obtener clima de Open-Meteo con alta precisión horaria
    async function fetchWeatherData() {
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${currentLat}&longitude=${currentLng}&hourly=cloud_cover,weather_code&timezone=auto`;
        const res = await fetch(url);
        const data = await res.json();
        
        forecastHours = data.hourly.time.map((t, idx) => ({
          time: new Date(t),
          cloudCover: data.hourly.cloud_cover[idx]
        }));

        evaluateSunWindows();
      } catch (err) {
        currentStatusTitle.textContent = "Error al conectar con Open-Meteo";
      }
    }

    function evaluateSunWindows() {
      if (!forecastHours.length) return;
      const now = new Date();
      const futureHours = forecastHours.filter(h => h.time >= new Date(now.getTime() - 30 * 60000));
      if (!futureHours.length) return;

      const current = futureHours[0];
      currentCloudBadge.textContent = `${current.cloudCover}% nubes`;
      updateDynamicBackground(current.cloudCover);

      if (current.cloudCover <= maxCloudThreshold) {
        currentIcon.innerHTML = `<i class="fa-solid fa-sun accent-text sun-pulse"></i>`;
        currentStatusTitle.textContent = "¡Hay sol en este momento!";
        currentStatusDesc.textContent = "Ventana despejada activa en tu zona.";
      } else {
        currentIcon.innerHTML = `<i class="fa-solid fa-cloud text-white/90"></i>`;
        currentStatusTitle.textContent = "Cielo nublado";
        currentStatusDesc.textContent = "Monitoreando aperturas de sol cercanas.";
      }

      // Buscar próxima ventana con <= 30% de nubes
      const nextSun = futureHours.find(h => h.cloudCover <= maxCloudThreshold && h.time > now);

      if (nextSun) {
        const timeStr = nextSun.time.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const diffMins = Math.round((nextSun.time - now) / 60000);
        
        nextWindowTime.textContent = timeStr;
        nextWindowCountdown.textContent = `En ${diffMins} min (${nextSun.cloudCover}% nubes)`;

        // Alerta si estamos dentro de la ventana configurada
        if (diffMins <= minutes && diffMins > minutes - 15) {
          playAlertSound();
          toast(`☀️ ¡HaySolcito: Se despeja en ${diffMins} min (${timeStr})!`);
        }
      } else {
        nextWindowTime.textContent = "--:--";
        nextWindowCountdown.textContent = "Sin sol despejado hoy";
      }

      renderHourlyList(futureHours.slice(0, 12));
    }

    function renderHourlyList(hours) {
      hourlyForecast.innerHTML = hours.map(h => {
        const timeLabel = h.time.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const isSun = h.cloudCover <= maxCloudThreshold;
        return `
          <div class="min-w-[65px] flex-1 bg-black/30 backdrop-blur-md rounded-2xl p-2.5 border ${isSun ? 'border-[#ff740e]/60 bg-[#ff740e]/10' : 'border-white/10'}">
            <div class="text-[10px] text-sky-200 font-semibold mb-1">${timeLabel}</div>
            <div class="text-lg my-1 ${isSun ? 'accent-text' : 'text-white/80'}">
              <i class="fa-solid ${isSun ? 'fa-sun' : 'fa-cloud'}"></i>
            </div>
            <div class="text-[11px] font-bold ${isSun ? 'accent-text' : 'text-white'}">${h.cloudCover}%</div>
          </div>
        `;
      }).join('');
    }

    // Botones y Eventos
    document.getElementById('btn-search').addEventListener('click', () => {
      const val = cityInput.value.trim();
      if (val) fetchLocationCoords(val);
    });

    cityInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && cityInput.value.trim()) {
        fetchLocationCoords(cityInput.value);
      }
    });

    document.getElementById('btn-gps').addEventListener('click', () => {
      if (navigator.geolocation) {
        locationDisplay.textContent = "Obteniendo GPS exacto...";
        navigator.geolocation.getCurrentPosition(pos => {
          currentLat = pos.coords.latitude;
          currentLng = pos.coords.longitude;
          locationDisplay.textContent = `GPS: ${currentLat.toFixed(2)}, ${currentLng.toFixed(2)}`;
          fetchWeatherData();
          toast("📍 Ubicación GPS precisa cargada");
        }, () => {
          toast("⚠️ No se pudo obtener la posición GPS.");
        });
      }
    });

    document.getElementById('notifBtn').addEventListener('click', () => {
      if ('Notification' in window) {
        Notification.requestPermission().then(perm => {
          if (perm === 'granted') {
            toast('🔔 Notificaciones de HaySolcito activadas');
          } else {
            toast('⚠️ Permisos de notificación denegados.');
          }
        });
      } else {
        toast('⚠️ Tu navegador no soporta notificaciones.');
      }
    });

    // Inicializar
    renderSeg();
    fetchLocationCoords('Palermo, Buenos Aires');
    setInterval(fetchWeatherData, 10 * 60 * 1000); // Actualizar cada 10 min
  </script>
</body>
</html>
